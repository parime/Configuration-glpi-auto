name: "Continuous Integration"

on:
  push:
    branches:
      - "main"
      - "dev"
      - "release/**"
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
      - "dev"
      - "release/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate-ci-matrix:
    name: "Generate CI matrix"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@v1"
    with:
      glpi-version: "11.0.x"

  ci:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: "generate-ci-matrix"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix.outputs.matrix) }}
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1"
    with:
      plugin-key: "configurationglpiauto"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"

  phpstan:
    name: "PHPStan Analysis"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: "Run PHPStan"
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  php-cs-fixer:
    name: "PHP-CS-Fixer"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: "Check code style"
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

  locales:
    name: "Locale Completeness"
    runs-on: ubuntu-latest
    needs: ci
    # #174: catches new __()/_n() strings added to the code without being propagated to
    # locales/*.po — same failure mode that let ~25 strings (version tracking, inventory,
    # certificate/licence types, recurring tickets, RSS feeds, project statuses) sit untranslated
    # in 4 of 5 languages for several sprints before anyone noticed. Regenerates the .pot from the
    # current code (vendor/bin/extract-locales, already a dev dependency — same tool a human
    # contributor would run by hand, not a hand-rolled regex) and fails if any string it finds is
    # missing a translation in any of the 5 shipped languages.
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: "Install gettext"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      - name: "Regenerate .pot from current code"
        run: |
          vendor/bin/extract-locales
          # extract-locales' own last step overwrites en_GB.po from scratch via msginit (French
          # msgid copied as a placeholder msgstr for every string, wiping real English
          # translations) — undo that so en_GB.po is checked the same way as the other 4
          # languages: merged against the fresh .pot, not blindly regenerated.
          git checkout -- locales/en_GB.po

      - name: "Check every language has a translation for every extracted string"
        run: |
          status=0
          for lang in fr_FR en_GB de_DE es_ES it_IT; do
            msgmerge --no-fuzzy-matching --quiet -o /tmp/merged_${lang}.po locales/${lang}.po locales/configurationglpiauto.pot
            missing=$(msgattrib --untranslated /tmp/merged_${lang}.po | grep -c '^msgid "[^"]' || true)
            if [ "$missing" -gt 0 ]; then
              echo "::error::${lang}.po is missing ${missing} translation(s) for strings present in the code"
              msgattrib --untranslated /tmp/merged_${lang}.po | grep '^msgid "[^"]'
              status=1
            fi
          done
          exit $status

  phpunit:
    name: "PHPUnit Tests"
    runs-on: ubuntu-latest
    needs: ci
    # No real GLPI here (plain shivammathur/setup-php) — explicitly pinned to phpunit.xml.dist
    # (tests/Unit only, pure PHP). tests/Integration/ needs a real, installed-and-activated GLPI
    # instance to exercise CommonDBTM::add()/real DB writes/rule evaluation against — that suite
    # runs inside the "ci" job above instead, which GLPI's official plugin-ci-workflows reusable
    # workflow already provides (auto-detects the bare phpunit.xml at repo root once it exists and
    # runs it from inside the real, plugin-activated container — confirmed by reading that
    # workflow's own source, not assumed). Two config files, two execution contexts, on purpose.
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: xdebug
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: "Run unit tests with coverage"
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist --coverage-text --coverage-clover=coverage.xml

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  trivy:
    name: "Trivy Security Scan"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Run Trivy vulnerability scanner"
        # scanners vuln,secret,misconfig (etait vuln seul) : aligne sur la
        # couverture deja en place sur le plugin jumeau remise-glpi, qui
        # detectait des secrets/mauvaises configurations que ce depot ne
        # verifiait pas du tout jusqu'ici.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pas @master (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret,misconfig'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  semgrep:
    name: "Semgrep SAST"
    runs-on: ubuntu-latest
    needs: ci
    # Analyse par motifs (SAST) : distincte de Trivy ci-dessus, qui couvre
    # secrets/mauvaises configurations/vulnerabilites connues des dependances
    # mais ne detecte pas des patterns de code dangereux (ex: injection SQL,
    # usage risque d'une fonction PHP) - deux outils complementaires, pas
    # redondants. Aligne sur le plugin jumeau remise-glpi, qui a ce job
    # depuis le debut - absent ici jusqu'ici.
    #
    # Pas de `continue-on-error` : sur remise-glpi, l'avoir mis a rendu
    # pendant un temps son statut CI "vert" quoi que semgrep trouve - corrige
    # le 2026-08-12 sur ce depot-la (cf. son propre historique de commits).
    # Reproduit ici directement sans cette erreur plutot que de la repeter.
    container:
      image: semgrep/semgrep
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
      - run: semgrep ci --config auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dependabot:
    name: "Dependabot Security"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: "Check for security vulnerabilities"
        run: |
          composer audit

  validation:
    name: "File Validation"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: "Validate JSON files"
        run: |
          find . -type f -name "*.json" -not -path "./vendor/*" -not -path "./.git/*" | xargs -I {} sh -c 'echo "Validating {}" && jq empty {} || exit 1'

      - name: "Install yamllint"
        run: |
          pip install --quiet yamllint

      - name: "Validate YAML files"
        run: |
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) -not -path "./vendor/*" -not -path "./.git/*" | xargs -I {} sh -c 'echo "Validating {}" && yamllint -c .yamllint.yml {} || exit 1'

      - name: "Install xmllint"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: "Validate XML files"
        run: |
          find . -type f -name "*.xml" -not -path "./vendor/*" -not -path "./.git/*" | xargs -I {} sh -c 'echo "Validating {}" && xmllint --noout {} || exit 1'

      - name: "Validate Composer JSON"
        run: |
          composer validate --strict

  quality-gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    needs: [phpstan, php-cs-fixer, phpunit, trivy, semgrep, dependabot, validation, locales]

    steps:
      - name: "All checks passed"
        run: |
          echo "All quality checks have passed successfully!"
          echo "PHPStan: ✓"
          echo "PHP-CS-Fixer: ✓"
          echo "PHPUnit: ✓"
          echo "Trivy: ✓"
          echo "Semgrep: ✓"
          echo "Dependabot: ✓"
          echo "Validation: ✓"
