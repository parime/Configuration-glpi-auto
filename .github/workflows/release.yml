name: Release

# Triggers on a version tag (vX.Y.Z): installs production dependencies, builds the plugin's
# distribution archive, verifies it actually installs on a fresh GLPI instance, then publishes
# the GitHub Release with that archive attached and auto-generated notes. Modeled on the release
# workflow already validated on the sibling glpi-vulnerability-manager plugin — no Packagist
# publish, no Discord webhook, no docs site: none of that infrastructure exists for this plugin,
# and a previous version of this workflow assumed it did, which would have failed on first use.
on:
  push:
    tags:
      - 'v*.*.*'

env:
  GLPI_IMAGE: glpi/glpi:11.0.8

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)

      - name: Verify the tag matches PLUGIN_CONFIGURATIONGLPIAUTO_VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION="$(grep -oP "define\('PLUGIN_CONFIGURATIONGLPIAUTO_VERSION', '\K[^']+" setup.php)"
          echo "Tag: $TAG_VERSION -- setup.php: $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PLUGIN_CONFIGURATIONGLPIAUTO_VERSION ($CODE_VERSION) in setup.php."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2 (SHA pinned, cf. Semgrep github-actions-mutable-action-tag)
        with:
          php-version: "8.2"
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Build the distribution archive
        # git archive (not a plain zip of the checkout): built exactly from what's committed at
        # the tag, automatically excluding anything marked export-ignore in .gitattributes
        # (tests/, .github/, CI/quality config...). vendor/ isn't versioned (see .gitignore) so
        # git archive can't include it — copied explicitly from the production install above.
        # configurationglpiauto/ prefix: the archive must extract directly under plugins/ on a
        # GLPI instance.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="configuration-glpi-auto-${VERSION}.zip"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

          mkdir -p /tmp/staging/configurationglpiauto
          git archive "$GITHUB_REF_NAME" | tar -x -C /tmp/staging/configurationglpiauto
          cp -r vendor /tmp/staging/configurationglpiauto/vendor

          (cd /tmp/staging && zip -qr "$GITHUB_WORKSPACE/${ARCHIVE_NAME}" configurationglpiauto)

      - name: Start MariaDB
        run: |
          docker network create cga-ci
          docker run -d --name mariadb --network cga-ci \
            -e MARIADB_ROOT_PASSWORD=glpi_password \
            -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user \
            -e MARIADB_PASSWORD=glpi_password \
            mariadb:11

          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done

      - name: Start GLPI (auto-install via the official image)
        run: |
          docker run -d --name glpi --network cga-ci \
            -e TIMEZONE=Europe/Paris \
            -e GLPI_DB_HOST=mariadb \
            -e GLPI_DB_PORT=3306 \
            -e GLPI_DB_NAME=glpidb \
            -e GLPI_DB_USER=glpi_user \
            -e GLPI_DB_PASSWORD=glpi_password \
            "$GLPI_IMAGE"

          echo "Waiting for GLPI auto-install to finish..."
          ready=0
          for i in $(seq 1 60); do
            docker exec glpi test -f /var/glpi/config/config_db.php && { ready=1; break; }
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::GLPI auto-install never finished (config_db.php missing)."
            docker logs glpi --tail 200
            exit 1
          fi

      - name: Validate the archive on a real GLPI instance
        run: |
          mkdir -p /tmp/archive-extracted
          unzip -q "$ARCHIVE_NAME" -d /tmp/archive-extracted
          docker cp /tmp/archive-extracted/configurationglpiauto glpi:/var/www/glpi/plugins/configurationglpiauto
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/configurationglpiauto

          ready=0
          for i in $(seq 1 12); do
            if docker exec glpi php bin/console database:update --force --no-interaction; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::database:update failed after 12 attempts."
            exit 1
          fi
          docker exec glpi php bin/console plugin:install configurationglpiauto --force --no-interaction
          docker exec glpi php bin/console plugin:activate configurationglpiauto --no-interaction

      - name: GLPI logs (on failure)
        if: failure()
        run: docker logs glpi --tail 200

      - name: Publish the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
