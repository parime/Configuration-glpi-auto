# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, cibles de notification, restes après désinstallation.
name: Sécurité commune

on:
  push:
  pull_request:
  # Relancé par release.yml sur la PR du catalogue, ouverte avec le GITHUB_TOKEN (qui ne
  # déclenche pas pull_request) : sans cela, les vérifications requises restent « en attente ».
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.1.0
    with:
      plugin-key: configurationglpiauto
      seed-command: php plugins/configurationglpiauto/tests/security/setup.php
