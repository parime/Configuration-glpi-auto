# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, cibles de notification, restes après désinstallation.
name: Sécurité commune

on:
  # Push : seulement les branches principales ; les branches de travail sont contrôlées par leur
  # PR. Évite deux exécutions (et deux notifications d'échec) pour chaque commit d'une PR.
  push:
    branches: [main]
  pull_request:
  # Lancement manuel possible (onglet Actions), par exemple pour revérifier une branche.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.7.0
    with:
      plugin-key: configurationglpiauto
      charter-mode: error
      seed-command: php plugins/configurationglpiauto/tests/security/setup.php && php plugins/configurationglpiauto/tests/security/setup.php fleet
