name: "Locales Sync"

on:
  push:
    branches:
      - "main"
      - "develop"
    paths:
      - "locales/**"
  pull_request:
    branches:
      - "main"
      - "develop"
    paths:
      - "locales/**"
  workflow_dispatch:

jobs:
  sync-translations:
    name: "Sync Translations"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: "Install dependencies"
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: "Extract translation strings"
        run: |
          # Extract all translation strings from PHP files
          find src/ setup.php hook.php -type f -name "*.php" | xargs grep -hoP '__(?:"[^"]*"|\'[^\']*\')' | sort | uniq > /tmp/strings.txt
          
          # Extract from other files
          find front/ -type f -name "*.php" | xargs grep -hoP '__(?:"[^"]*"|\'[^\']*\')' >> /tmp/strings.txt
          
          echo "Found $(wc -l < /tmp/strings.txt) unique translation strings"

      - name: "Update POT files"
        run: |
          # Create or update POT files for each language
          for file in locales/*.po; do
            if [ -f "$file" ]; then
              # Update existing PO file
              msgmerge -U "$file" /tmp/strings.txt || true
            else
              # Create new POT file
              xgettext --from-code=UTF-8 --keyword=__ --keyword=__s --output=locales/configurationglpiauto.pot /tmp/strings.txt || true
            fi
          done

      - name: "Check for missing translations"
        run: |
          # Check for missing translations in English
          echo "Checking for missing English translations..."
          
          # Extract strings from code
          code_strings=$(find src/ setup.php hook.php front/ -type f -name "*.php" | xargs grep -hoP '__(?:"[^"]*"|\'[^\']*\')' | sort | uniq)
          
          # Extract strings from English PO file
          if [ -f "locales/en_GB.po" ]; then
            po_strings=$(grep -hoP 'msgid "[^"]*"' locales/en_GB.po | sed 's/msgid "//;s/"$//' | sort | uniq)
            
            # Find missing translations
            missing=$(comm -23 <(echo "$code_strings" | sort) <(echo "$po_strings" | sort))
            
            if [ -n "$missing" ]; then
              echo "::warning:: Missing English translations:"
              echo "$missing"
              echo "" >> missing_translations.txt
              echo "$missing" >> missing_translations.txt
              exit 1
            else
              echo "All strings have English translations"
            fi
          else
            echo "::warning:: English PO file not found"
          fi

      - name: "Validate PO files"
        run: |
          # Validate all PO files
          for file in locales/*.po; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              msgfmt --check-format -o /dev/null "$file" || {
                echo "::error:: Invalid PO file format: $file"
                exit 1
              }
            fi
          done

  tx-push:
    name: "Push to Transifex"
    runs-on: ubuntu-latest
    needs: sync-translations
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Transifex client"
        run: |
          pip install transifex-client

      - name: "Push source strings to Transifex"
        run: |
          cd locales
          tx push -s --skip
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}

      - name: "Pull translations from Transifex"
        run: |
          cd locales
          tx pull -a --skip
        env:
          TX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}

      - name: "Commit updated translations"
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if git diff --quiet locales/; then
            echo "No translation changes"
          else
            git add locales/
            git commit -m "chore: Update translations from Transifex"
            git push
          fi
