version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "php"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "parime"
    assignees:
      - "parime"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # 7 jours avant de proposer une version tout juste publiee (cf. Semgrep
    # dependabot-missing-cooldown, aligne sur le plugin jumeau remise-glpi) :
    # laisse le temps a la communaute de detecter un paquet compromis/instable
    # avant qu'on ne l'adopte.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "parime"
    assignees:
      - "parime"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
